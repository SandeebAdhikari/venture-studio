[project]
name = "ai-venture-studio-api"
version = "0.1.0"
description = "AI Venture Studio backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.115.0,<1",
    "langgraph>=0.2.0,<1",
    "openai>=1.55.0,<2",
    "pgvector>=0.3.6,<1",
    "psycopg[binary]>=3.2.0,<4",
    "pydantic-settings>=2.6.0,<3",
    "python-json-logger>=3.2.0,<4",
    "redis>=5.2.0,<6",
    "feedparser>=6.0.0,<7",
    "httpx>=0.28.0,<1",
    "arq>=0.26.0,<0.27",
    "apscheduler>=3.10.0,<4",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.32.0,<1",
    "prometheus-client>=0.21.0,<1",
    "pyyaml>=6.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "ruff>=0.8.0,<0.9",
]
observability-sentry = ["sentry-sdk>=2.0.0,<3"]
observability-opentelemetry = [
    "opentelemetry-api>=1.28.0,<2",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
force-include = { "app/founder_fit/data/mechanism_requirement_matrix_cm_v1.yaml" = "app/founder_fit/data/mechanism_requirement_matrix_cm_v1.yaml" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
