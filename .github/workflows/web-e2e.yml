name: Web E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  API_KEY: ci-github-actions-api-key
  AUTH_SECRET: ci-e2e-auth-secret-must-be-at-least-32-chars
  E2E_PASSWORD: e2e-test-password
  E2E_VIEWER_PASSWORD: e2e-test-password
  E2E_ADMIN_PASSWORD: e2e-test-password
  DASHBOARD_USERS: >-
    [{"username":"founder","password":"e2e-test-password","role":"founder"},
    {"username":"admin","password":"e2e-test-password","role":"admin"},
    {"username":"viewer","password":"e2e-test-password","role":"viewer"}]

jobs:
  playwright:
    name: Playwright dashboard E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare API environment
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-github-actions-api-key/' .env
          grep -q '^REQUIRE_FOUNDER_APPROVAL=' .env \
            && sed -i 's/^REQUIRE_FOUNDER_APPROVAL=.*/REQUIRE_FOUNDER_APPROVAL=true/' .env \
            || echo 'REQUIRE_FOUNDER_APPROVAL=true' >> .env

      - name: Start backend stack
        run: docker compose up --build -d

      - name: Set up Python for deployment verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install API package
        working-directory: api
        run: pip install -e .

      - name: Verify API deployment
        run: ./api/scripts/verify-deployment.sh
        env:
          API_URL: http://localhost:8000
          TIMEOUT_SEC: 180

      - name: Seed E2E fixtures
        run: cd api && PYTHONPATH=. python scripts/seed_e2e_fixtures.py
        env:
          REQUIRE_FOUNDER_APPROVAL: "true"
          API_KEY: ci-github-actions-api-key
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: avs
          POSTGRES_PASSWORD: avs
          POSTGRES_DB: ai_venture_studio
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build dashboard
        working-directory: web
        run: npm run build
        env:
          API_URL: http://localhost:8000
          API_KEY: ci-github-actions-api-key
          AUTH_SECRET: ci-e2e-auth-secret-must-be-at-least-32-chars
          DASHBOARD_USERS: ${{ env.DASHBOARD_USERS }}

      - name: Start dashboard
        working-directory: web
        run: |
          npm run start > /tmp/web-e2e.log 2>&1 &
          echo $! > /tmp/web-e2e.pid
        env:
          API_URL: http://localhost:8000
          API_KEY: ci-github-actions-api-key
          AUTH_SECRET: ci-e2e-auth-secret-must-be-at-least-32-chars
          DASHBOARD_USERS: ${{ env.DASHBOARD_USERS }}

      - name: Wait for dashboard
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/login >/dev/null; then
              echo "Dashboard ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dashboard failed to start"
          cat /tmp/web-e2e.log || true
          exit 1

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: web
        run: npm run test:e2e:ci
        env:
          CI: true
          E2E_BASE_URL: http://localhost:3000
          E2E_PASSWORD: e2e-test-password
          E2E_VIEWER_PASSWORD: e2e-test-password
          E2E_API_KEY: ci-github-actions-api-key

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Stop dashboard
        if: always()
        run: |
          if [ -f /tmp/web-e2e.pid ]; then
            kill "$(cat /tmp/web-e2e.pid)" 2>/dev/null || true
          fi

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
