name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: api

jobs:
  ruff:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install Ruff
        run: pip install "ruff>=0.8.0,<0.9"

      - name: Ruff lint
        run: ruff check app tests alembic

      - name: Ruff format check
        run: ruff format --check app tests alembic
