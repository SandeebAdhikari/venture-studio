name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  API_KEY: ci-github-actions-api-key
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: avs
  POSTGRES_PASSWORD: avs
  POSTGRES_DB: ai_venture_studio
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  SCHEDULER_ENABLED: "false"
  REQUIRE_FOUNDER_APPROVAL: "false"

defaults:
  run:
    working-directory: api

jobs:
  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avs
          POSTGRES_PASSWORD: avs
          POSTGRES_DB: ai_venture_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avs -d ai_venture_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify single Alembic head
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            alembic heads
            exit 1
          fi

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify schema matches models
        run: alembic check

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    needs: migrations
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avs
          POSTGRES_PASSWORD: avs
          POSTGRES_DB: ai_venture_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avs -d ai_venture_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -q --tb=short
