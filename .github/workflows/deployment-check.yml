name: Deployment Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  API_KEY: ci-github-actions-api-key

jobs:
  build-validation:
    name: Build validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build API Docker image
        run: docker build -t ai-venture-studio-api:ci ./api

      - name: Install package
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Build wheel and sdist
        working-directory: api
        run: |
          pip install build
          python -m build

      - name: Verify application imports
        working-directory: api
        run: |
          PYTHONPATH=. python -c "from app.main import app; assert app.title"

      - name: Verify worker settings import
        working-directory: api
        run: |
          PYTHONPATH=. python -c "from app.workers.worker import WorkerSettings; assert WorkerSettings.functions"
